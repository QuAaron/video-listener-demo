<!doctype html><html lang="zh-CN" data-register="blueprint"><head><title>听见 · 看见｜动态架构图</title><link rel="stylesheet" href="kit.css" data-ve-kit><style>
main{max-width:1240px;margin:auto;padding:32px clamp(16px,4vw,64px)}header{margin-bottom:18px}h1{font-size:clamp(26px,4vw,48px);margin:8px 0}button{cursor:pointer;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border-bright);padding:7px 12px;border-radius:5px}button:disabled{opacity:.4}button:focus-visible{outline:3px solid var(--accent)}.strip,.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.strip{margin:10px 0 0}.strip button[aria-current=true],#play{background:#146257;color:white}.map{overflow-x:auto}.map svg{width:100%;min-width:760px;height:auto;display:block}.box{fill:var(--surface);stroke:var(--border-bright);stroke-width:1.6}.node.focus .box{stroke:#269c86;stroke-width:4}.title{font-size:19px;font-weight:700;fill:var(--text)}.small{font-size:14px;fill:var(--text)}.rail{fill:none;stroke:var(--border-bright);stroke-width:2}.rail.focus{stroke:#269c86;stroke-width:3;stroke-dasharray:8 4;animation:travel 1s linear infinite}@keyframes travel{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.rail.focus{animation:none}}.lane{font-size:14px;fill:var(--muted)}.readout{padding:12px 0;min-height:100px}.readout strong{font-size:20px}.readout p{margin:6px 0}.controls span{font-variant-numeric:tabular-nums;margin-right:10px}.foot{margin-top:16px;color:var(--muted);font-size:13px}
</style></head><body><main><header><p class="eyebrow">听见 · 看见 / 本地视频笔记</p><h1>声音与画面在哪里汇合？</h1><p>浏览器分别保存转写和关键帧。启用视觉总结后，两路证据按会话时间配对。</p></header><figure><div class="map frame" tabindex="0" aria-label="架构图，可横向滚动"><svg viewBox="0 0 1060 445" role="img" aria-label="音轨经分块队列与 Whisper 转写，视频经 Canvas 采帧，两路在浏览器按时间窗配对，再送入本机视觉模型。"><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="currentColor"/></marker></defs><text class="lane" x="25" y="32">浏览器 · 采集与处理</text><text class="lane" x="664" y="32">会话时间轴</text><text class="lane" x="864" y="129">可选 · 视觉总结</text><text class="lane" x="210" y="162">音轨 ↑</text><text class="lane" x="210" y="211">画面 ↓</text><text class="lane" x="707" y="262">挑选证据帧</text><text class="lane" x="952" y="263">经本机代理</text><text class="lane" x="780" y="389">返回分段分析</text><path class="rail" data-step="2" d="M163 168H188V90H216" marker-end="url(#tip)"/><path class="rail" data-step="3" d="M376 90H431" marker-end="url(#tip)"/><path class="rail" data-step="3" d="M599 90H660" marker-end="url(#tip)"/><path class="rail" data-step="4" d="M163 182H188V276H216" marker-end="url(#tip)"/><path class="rail" data-step="4" d="M376 276H431" marker-end="url(#tip)"/><path class="rail" data-step="5" d="M818 90H841V164H860" marker-end="url(#tip)"/><path class="rail" data-step="5" d="M599 276H841V193H860" marker-end="url(#tip)"/><path class="rail" data-step="6" d="M945 211V300" marker-end="url(#tip)"/><path class="rail" data-step="7" d="M945 370V398H769" marker-end="url(#tip)"/><g class="node" data-step="1" transform="translate(25 145)"><rect class="box" width="138" height="65" rx="7"/><text class="title" x="12" y="28">共享标签页</text><text class="small" x="12" y="51">声音与画面</text></g><g class="node" data-step="2" transform="translate(220 60)"><rect class="box" width="156" height="65" rx="7"/><text class="title" x="12" y="28">混音与分块</text><text class="small" x="12" y="51">AudioWorklet → 队列</text></g><g class="node" data-step="3" transform="translate(435 60)"><rect class="box" width="164" height="65" rx="7"/><text class="title" x="12" y="28">本地语音识别</text><text class="small" x="12" y="51">Whisper · Worker</text></g><g class="node" data-step="3" transform="translate(664 60)"><rect class="box" width="154" height="65" rx="7"/><text class="title" x="12" y="28">转写片段</text><text class="small" x="12" y="51">文本 ＋ 起止时间</text></g><g class="node" data-step="4" transform="translate(220 245)"><rect class="box" width="156" height="65" rx="7"/><text class="title" x="12" y="28">变化优先采帧</text><text class="small" x="12" y="51">视频 → Canvas</text></g><g class="node" data-step="4" transform="translate(435 245)"><rect class="box" width="164" height="65" rx="7"/><text class="title" x="12" y="28">关键帧</text><text class="small" x="12" y="51">JPEG ＋ 会话时间</text></g><g class="node" data-step="5" transform="translate(864 145)"><rect class="box" width="162" height="65" rx="7"/><text class="title" x="12" y="28">同窗配对</text><text class="small" x="12" y="51">planVision · 30 秒</text></g><g class="node" data-step="6" transform="translate(864 304)"><rect class="box" width="162" height="65" rx="7"/><text class="title" x="12" y="28">本地视觉模型</text><text class="small" x="12" y="51">llama.cpp · Qwen</text></g><g class="node" data-step="7" transform="translate(565 365)"><rect class="box" width="200" height="65" rx="7"/><text class="title" x="12" y="28">会话概览</text><text class="small" x="12" y="51">按时间汇编分段结果</text></g></svg></div><figcaption>采帧与转写并行。图中的播放顺序用于分步讲解。</figcaption><nav class="strip" aria-label="跳到指定步骤"><button data-jump="0">1 共享</button><button data-jump="1">2 分块</button><button data-jump="2">3 转写</button><button data-jump="3">4 采帧</button><button data-jump="4">5 配对</button><button data-jump="5">6 看图</button><button data-jump="6">7 汇编</button></nav><div class="readout" aria-live="polite"><strong id="heading"></strong><p id="detail"></p></div><div class="controls"><span id="count"></span><button id="prev">上一步</button><button id="play">自动播放</button><button id="next">下一步</button></div></figure><p class="foot">源码依据　src/main.ts · src/asr.ts · src/vision-core.ts · src/vision-ui.ts · server/vision-proxy.ts</p></main><script>
const scenes=[["共享","选择视频标签页","加载 Whisper 后，用户选择标签页并共享音频。浏览器从同一条媒体流读取音轨和画面，两条路径并行。"],["分块","声音进入串行队列","AudioWorklet 将声道混为单声道。主线程每约 12 秒形成一个音频块，相邻块重叠 1 秒，依次送进 Worker。"],["转写","音频块变成带时间的文字","Worker 重采样至 16 kHz，过滤静音，再用 Whisper 识别。主线程对重叠边界去重，保存文本和会话时间。"],["采帧","画面沿另一条路径采样","采帧与转写同时进行。每个保存段先留一帧，再用低分辨率缩略图比较画面变化。两帧至少间隔 12 秒，静止约 90 秒补一帧。"],["配对","两条路径在浏览器里汇合","停止采集并排空识别队列后，用户授权、检查模型并运行分析。planVision 按 30 秒划窗，为有帧的窗口选最多两帧，配上时间重叠的讲解。"],["看图","本机模型分析同窗证据","网页把选中的 JPEG 和讲解交给同源 Node 代理，由代理调用本机 Qwen。模型分别给出讲者观点、画面观察、冲突与不确定项。"],["汇编","按时间生成可回看的概览","浏览器按窗口顺序汇编模型已分析的片段，保留时间和帧引用。采集期间默认每 12 分钟另存转写、关键帧和摘录摘要，结束时补存尾段。"]];
let current=0,timer=null;
const byId=id=>document.getElementById(id);
function draw(){
 byId('heading').textContent=scenes[current][1];byId('detail').textContent=scenes[current][2];byId('count').textContent=(current+1)+' / '+scenes.length;
 document.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('focus',Number(el.dataset.step)===current+1));
 document.querySelectorAll('[data-jump]').forEach(el=>el.setAttribute('aria-current',String(Number(el.dataset.jump)===current)));
 byId('prev').disabled=current===0;byId('next').disabled=current===scenes.length-1;byId('play').textContent=timer?'暂停':current===scenes.length-1?'重新播放':'自动播放';
}
function stop(){clearInterval(timer);timer=null}
function jump(n){stop();current=n;draw()}
byId('prev').onclick=()=>jump(current-1);byId('next').onclick=()=>jump(current+1);
document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>jump(Number(el.dataset.jump)));
byId('play').onclick=()=>{if(timer){stop()}else{if(current===scenes.length-1)current=0;timer=setInterval(()=>{current++;if(current===scenes.length-1)stop();draw()},4800)}draw()};draw();
</script></body></html>
